<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Team discussion</title>
    <link rel="stylesheet" href="chat.css">
    <script type="module" src="chat.js"></script>
  </head>
  <body>
    <main class="chat" aria-labelledby="chat-title">
      <header class="chat-header">
        <div>
          <h1 id="chat-title">Team discussion</h1>
          <p class="chat-description">Everyone signed in can read this chat.</p>
        </div>
        <button id="sign-out" class="text-button" type="button" hidden>Sign out</button>
      </header>

      <section id="sign-in-view" class="sign-in">
        <button id="sign-in" class="primary-button" type="button" hidden>Sign in with Google</button>
        <p id="auth-status" role="status">Loading chat…</p>
      </section>

      <section id="conversation" class="conversation" aria-label="Shared conversation" hidden>
        <div id="message-scroll" class="message-scroll" tabindex="0" aria-label="Message history">
          <button id="load-earlier" class="text-button" type="button" hidden>Load earlier messages</button>
          <button id="retry-history" class="text-button" type="button" hidden>Reload messages</button>
          <p id="history-status" role="status">Loading messages…</p>
          <ol id="messages"></ol>
        </div>
        <form id="compose">
          <div class="compose-row">
            <textarea id="message-input" aria-label="Message" placeholder="Write a message…" rows="2" maxlength="2000" required></textarea>
            <button id="send" class="primary-button" type="submit">Send</button>
          </div>
          <p id="chat-status" role="status"></p>
        </form>
      </section>
    </main>
  </body>
</html>
