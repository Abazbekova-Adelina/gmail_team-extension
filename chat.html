<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Threadly · Team discussion</title>
    <link rel="stylesheet" href="chat.css">
    <script type="module" src="chat.js"></script>
  </head>
  <body>
    <main class="chat" aria-labelledby="chat-title">
      <header class="chat-header">
        <div class="chat-brand">
          <span class="brand-mark" aria-hidden="true">
            <img src="assets/threadly-mark.png" alt="" width="34" height="38">
          </span>
          <div class="brand-copy">
            <h1 id="chat-title">Threadly</h1>
            <p id="chat-description" class="chat-description">Discuss this email privately with your team.</p>
          </div>
        </div>
        <select id="connected-workspace" aria-label="Workspace for this email" hidden></select>
      </header>
      <p id="workspace-status" role="status">Loading chat…</p>

      <form id="connect-form" class="connect-form" hidden>
        <label for="connect-workspace">Workspace</label>
        <select id="connect-workspace" required></select>
        <button id="connect-button" class="primary-button" type="submit">Connect Threadly</button>
      </form>

      <section id="conversation" class="conversation" aria-label="Shared conversation" hidden>
        <div id="message-scroll" class="message-scroll" tabindex="0" aria-label="Message history">
          <button id="load-earlier" class="text-button" type="button" hidden>Load earlier messages</button>
          <button id="retry-history" class="text-button" type="button" hidden>Reload messages</button>
          <p id="history-status" role="status">Loading messages…</p>
          <ol id="messages"></ol>
        </div>
        <form id="compose">
          <div class="compose-row">
            <div class="message-editor">
              <textarea id="message-input" aria-label="Message" aria-autocomplete="list" aria-controls="mention-suggestions" placeholder="Write a message…" rows="2" maxlength="2000" required></textarea>
              <ul id="mention-suggestions" role="listbox" aria-label="Teammates to mention" hidden></ul>
            </div>
            <button id="send" class="primary-button" type="submit">Send</button>
          </div>
          <p id="mention-status" role="status"></p>
          <p id="chat-status" role="status"></p>
        </form>
      </section>
    </main>
  </body>
</html>
