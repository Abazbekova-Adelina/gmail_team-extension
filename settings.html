<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workspace settings</title>
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="settings.css">
    <script type="module" src="settings.js"></script>
  </head>
  <body class="settings-page">
    <main class="chat" aria-labelledby="chat-title">
      <header class="chat-header">
        <h1 id="chat-title">Threadly</h1>
        <div class="account-controls">
          <div id="account-profile" class="account-profile" hidden></div>
          <button id="sign-out" class="text-button" type="button" hidden>Sign out</button>
        </div>
      </header>

      <section id="sign-in-view" class="sign-in">
        <button id="sign-in" class="primary-button" type="button" hidden>Sign in with Google</button>
        <p id="auth-status" role="status">Loading settings…</p>
      </section>

      <section id="workspace-view" hidden aria-label="Workspace">
        <nav class="settings-nav" aria-label="Settings views">
          <button id="workspace-view-button" type="button" aria-pressed="true" aria-controls="workspace-controls">Workspace</button>
          <button id="activity-view-button" type="button" aria-pressed="false" aria-controls="activity-view">Activity <span id="unread-count" hidden></span></button>
        </nav>
        <section id="featured-invite" class="workspace-toolbar" hidden aria-label="Invitation"></section>
        <section id="activity-view" class="activity-view" aria-label="Activity" hidden>
          <p id="activity-status" role="status"></p>
          <ul id="activity-list" class="settings-list"></ul>
        </section>
        <div id="workspace-controls">
          <div class="workspace-toolbar">
            <label for="workspace-select">Workspace</label>
            <select id="workspace-select"><option value="">Choose a workspace</option></select>
            <button id="refresh-teams" class="text-button" type="button">Refresh</button>
          </div>
          <p id="workspace-status" role="status"></p>
          <div id="team-settings">
            <details id="create-settings" class="settings-disclosure">
              <summary>Create a workspace</summary>
              <form id="create-workspace" class="settings-form">
                <label for="workspace-name" class="visually-hidden">Workspace name</label>
                <input id="workspace-name" placeholder="e.g. Design team" maxlength="80" required>
                <button class="primary-button" type="submit">Create</button>
              </form>
            </details>
            <details id="people-settings" class="settings-disclosure">
              <summary>People and invitations</summary>
              <section aria-label="Your invitations">
                <h2>Your invitations</h2>
                <ul id="my-invitations" class="settings-list"></ul>
              </section>
              <section id="owner-settings" hidden>
                <form id="invite-member" class="settings-form">
                  <label for="invite-email">Invite by email</label>
                  <input id="invite-email" type="email" placeholder="teammate@gmail.com" maxlength="320" required>
                  <button class="primary-button" type="submit">Invite</button>
                </form>
                <p class="settings-hint">Tell your teammate to sign in with this email and accept in Workspace settings within 7 days.</p>
                <h2>Pending invitations</h2>
                <ul id="pending-invitations" class="settings-list"></ul>
              </section>
              <section id="member-settings" hidden>
                <h2>Members</h2>
                <ul id="team-members" class="settings-list"></ul>
              </section>
            </details>
        </div>
        </div>
      </section>

    </main>
  </body>
</html>
